<!DOCTYPE html>
<html>

<head>
    <title>Total Collection</title>

    <style>
        body {
            font-family: Arial;
            background: #f1f5f9;
        }

        .box {
            max-width: 450px;
            margin: 80px auto;
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 3px 15px #ccc;
        }

        .money {
            font-size: 40px;
            color: #16a34a;
        }

        a {
            display: block;
            margin-top: 25px;
        }
    </style>

</head>

<body>

<div class="box">

    <h1>💰 Total Collection</h1>

    <div class="money">
        ₹{{ total }}
    </div>

    <a href="/dashboard">⬅ Back to Dashboard</a>


</div>

</body>

</html>
